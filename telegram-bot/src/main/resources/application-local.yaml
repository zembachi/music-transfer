server:
  port: 8086

spring:
  datasource:
    # говорим спрингу, чтобы настроил нам датасорс для встроенной бд h2
    embedded-database-connection: h2
    url: jdbc:h2:mem:test_mem;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS TEST\;SET SCHEMA TEST\;create user if not exists LIQUIBASE_USER password 'password' admin
  # включаем доступ к консоли h2 ( localhost:{server.port}/h2-console )
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
  liquibase:
    default-schema: TEST
    password: password
    user: LIQUIBASE_USER
    change-log: classpath:/db/changelog/db.changelog-master.xml
  rabbitmq:
    host:


oidc:
  keycloak:
    client-id: music-transfer-app
    scope: openid offline_access
    realm: SpringBootKeycloak
    base-url: http://192.168.59.100/keycloak
    client-secret: test
    callback: http://127.0.0.1:8086/auth
  token:
    # время жизни токена, минуты
    lifetime: 30
    # за сколько минут до окончания жизни токена обновить его. например если стоит 5 мин, то при жизни токена в 60 минут приложение обновит его за 55 минут
    offset: 300000


app.resource.server:
  url: localhost:8085/api

logging:
  level:
    com.music.transfer.thymeleaf.feign.AppResourceServerFeignClient: DEBUG
feign:
  client:
    config:
      resource-server:
        requestInterceptors:
          - com.music.transfer.thymeleaf.feign.interceptor.FeignRequestAuthHeaderInterceptor
        loggerLevel: FULL

